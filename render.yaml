services:
  - type: web
    name: therapist-simulator-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: GROK_API_KEY
        sync: false
      - key: GROK_MODEL
        value: grok-4
      - key: GROK_BASE_URL
        value: https://api.x.ai/v1
      - key: DATABASE_URL
        sync: false
      - key: APP_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
